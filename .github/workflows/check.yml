name: check

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    # The organisation requires a status check with this exact name on main.
    name: CI Required
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline checks
        run: python3 scripts/check.py
      - name: Registry drift check
        # A server publishing a new registry version is not a contributor's
        # fault, so drift only fails the weekly and manual runs.
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 scripts/check.py --live
